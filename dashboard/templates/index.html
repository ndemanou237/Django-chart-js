<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard moderne</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Bootstrap 5.3 CSS (À mettre dans le <head>) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        canvas{
            margin: 20px;
            max-width: 100%;
        }
    </style>
    
    
</head>
<body>
    <h1 class="text-center my-4">Dashboard Moderne avec chart.js</h1>
    <div class="container">
        <div class="row">
            <div class="col-md-6 col-lg-6">
                <canvas id="lineChart">

                </canvas>

            </div>
            <div class="col-md-6 col-lg-6">
                <canvas id="barChart">
            
                </canvas>
            
            </div>
            <div class="col-md-6 col-lg-6">
                <canvas id="radarChart">
            
                </canvas>
            
            </div>
            <div class="col-md-6 col-lg-6">
                <canvas id="donutChart">
            
                </canvas>
            
            </div>
        </div>
    </div>


    
    <script>

        const lineChart = new Chart(document.getElementById('lineChart'), {
            type: 'line',
            data: {
                labels : {{ line_labels|safe }},
                datasets : [{
                    label: 'Visiteurs mensuels',
                    data: {{ line_data|safe }},
                    fill: true,
                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    tension: 0.3
                }]
            },
            options: {
                responsive: true
            }
        });

        const barChart = new Chart(document.getElementById('barChart'), {
            type: 'bar',
            data: {
                labels : {{ bar_labels|safe }},
                datasets : [{
                    label: 'Ventes',
                    data: {{ line_data|safe }},
                    backgroundColor: 'rgba(255, 99, 132, 0.6)',
                    tension: 0.3
                }]
            },
            options: {
                responsive: true
            }
        });

        const radarChart = new Chart(document.getElementById('radarChart'), {
            type: 'radar',
            data: {
                labels : {{ radar_labels|safe }},
                datasets : [{
                    label: 'Satisfaction (%)',
                    data: {{ radar_data|safe }},
                    fill: true,
                    backgroundColor: 'rgba(255, 206, 86, 0.2)',
                    borderColor: 'rgba(255, 206, 86, 1)',
                    pointBackgroundColor: 'rgba(255, 206, 86, 0.2)'
                    
                }]
            },
            options: {
                responsive: true
            }
        });

        const donutChart = new Chart(document.getElementById('donutChart'), {
            type: 'doughnut',
            data: {
                labels : {{ donut_labels|safe }},
                datasets : [{
                    label: 'Satisfaction (%)',
                    data: {{ donut_data|safe }},
                    fill: true,
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.6)',
                        'rgba(255, 206, 86, 0.6)',
                        'rgba(54, 162, 235, 0.6)',
                        'rgba(75, 192, 255, 0.6)',
                        'rgba(153, 192, 255, 0.6)',
                    ],
                    borderWidth: 1,
                    
                    
                }],
            },
            options: {
                responsive: true
            }
        });
    </script>
    
</body>
</html>
